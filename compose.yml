services:
  dozzle:
    image: amir20/dozzle:latest
    pull_policy: always
    environment:
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME:-yarden-zamir-vps-2}
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_PARAMS_FILE: ${KITSHN_PARAMS_FILE}
      KITSHN_DATA_DIR: ${KITSHN_DATA_DIR}
      KITSHN_LOG_DIR: ${KITSHN_LOG_DIR}
      KITSHN_SOCKET_DIR: ${KITSHN_SOCKET_DIR}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${KITSHN_DATA_DIR}:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  socket-proxy:
    image: alpine/socat:latest
    pull_policy: always
    command: ["UNIX-LISTEN:${KITSHN_DEFAULT_SOCKET},fork,unlink-early,mode=666", "TCP:dozzle:8080"]
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    depends_on:
      - dozzle
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # GitHub login gate. Caddy sends every request through forward_auth to this
  # socket and only proxies requests that oauth2-proxy accepts.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    pull_policy: always
    # The image runs as uid 2000. The socket dir is root-owned, so bind as root.
    # Limit: revisit when KitSHn creates the socket dir group-writable.
    user: "0:0"
    command:
      - --http-address=unix://${KITSHN_SOCKET_DIR}/auth.sock,mode=0666
      - --provider=github
      - --proxy-prefix=/auth
      - --redirect-url=https://dozzle.yarden-zamir.com/auth/callback
      - --whitelist-domain=dozzle.yarden-zamir.com
      - --reverse-proxy=true
      # Without --github-org or --github-repo, a GitHub login other than this one
      # fails sign-in ("missing github user", providers/github.go checkUserRestriction).
      - --github-user=Yarden-zamir
      - --email-domain=*
      - --skip-provider-button=true
      - --cookie-name=_dozzle_oauth
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=168h
      # forward_auth uses /auth/auth only; oauth2-proxy still needs one upstream to start.
      - --upstream=static://202
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?OAUTH2_PROXY_CLIENT_ID is required}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET is required}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET is required}
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    # No healthcheck: the image is distroless (no shell, no test, no curl), so a
    # CMD check can never pass. KitSHn then waits for "running" only.
    restart: unless-stopped
